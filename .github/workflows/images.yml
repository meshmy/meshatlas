name: images

# Builds the api and web images on every relevant pull request and publishes
# them to GHCR from develop, master and version tags. The web image bakes the
# Vite build ARGs in at build time (see web/Dockerfile), so the published image
# uses the Dockerfile defaults; a deployment that needs other map styles
# builds web itself.

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshatlas-${{ matrix.component }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
